<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>复读提分预测 - 结果</title>
    <link rel="stylesheet" href="css/result.css">
</head>
<body>
    <!-- 气泡背景容器 -->
    <div class="bubbles"></div>
    <div class="container">
        <h1>AI智能复读提分预测</h1>
        
        <!-- AI分析加载界面 -->
        <div id="aiLoadingContainer" class="ai-loading-container">
            <div class="ai-loading-content">
                <div class="ai-brain-animation">
                    <div class="brain-core"></div>
                    <div class="brain-wave wave-1"></div>
                    <div class="brain-wave wave-2"></div>
                    <div class="brain-wave wave-3"></div>
                </div>
                <h2>AI正在分析您的测试结果...</h2>
                <p class="loading-text">运用先进的Qwen大模型，深度分析您的学习潜力</p>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <div class="loading-steps">
                    <div class="step active" data-step="1">📊 分析答题数据</div>
                    <div class="step" data-step="2">🧠 AI智能评估</div>
                    <div class="step" data-step="3">📈 生成预测报告</div>
                    <div class="step" data-step="4">💡 制定个性化建议</div>
                </div>
            </div>
        </div>
        
        <!-- AI分析结果展示 -->
        <div id="aiResultsContainer" style="display: none;">
            <!-- AI分析结果将动态加载 -->
        </div>
        
        <!-- 传统结果展示（备用） -->
        <div id="traditionalResults" style="display: none;">
            <!-- 传统结果将通过JavaScript动态加载 -->
        </div>
        
        <div id="noResults" class="no-results" style="display: none;">
            <p>未找到测试结果，请先完成测试。</p>
            <a href="index.html" class="btn">重新开始测试</a>
        </div>
    </div>

    <script src="js/result.js"></script>
    <script src="js/bubbles.js"></script>
</body>
</html>
