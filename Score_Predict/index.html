<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI复读提分预测系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* 背景动画效果 */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .floating-element {
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .main-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 32px 64px rgba(0, 0, 0, 0.2);
            padding: 50px;
            max-width: 600px;
            width: 90%;
            text-align: center;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .logo-section {
            margin-bottom: 40px;
        }

        .ai-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: white;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.3);
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 18px;
            color: #718096;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* 四大模块展示 */
        .modules-preview {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .module-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .module-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.2);
        }

        .module-icon {
            font-size: 24px;
            color: #667eea;
            margin-bottom: 8px;
        }

        .module-title {
            font-size: 16px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 5px;
        }

        .module-desc {
            font-size: 12px;
            color: #718096;
            line-height: 1.4;
        }

        /* 密码输入区域 */
        .auth-section {
            background: rgba(248, 250, 252, 0.8);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .auth-title {
            font-size: 20px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 20px;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-label {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 16px;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .password-input {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
            outline: none;
        }

        .password-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .password-input:focus + .input-label,
        .password-input:not(:placeholder-shown) + .input-label {
            top: -8px;
            left: 16px;
            font-size: 12px;
            color: #667eea;
            background: white;
            padding: 0 8px;
            border-radius: 4px;
        }

        .submit-btn {
            width: 100%;
            padding: 18px 32px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.6s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .error-message {
            color: #e53e3e;
            font-size: 14px;
            margin-top: 15px;
            padding: 12px;
            background: rgba(229, 62, 62, 0.1);
            border: 1px solid rgba(229, 62, 62, 0.2);
            border-radius: 8px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .features-text {
            margin-top: 30px;
            font-size: 14px;
            color: #718096;
            line-height: 1.6;
        }

        .highlight {
            color: #667eea;
            font-weight: 600;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-container {
                padding: 30px 25px;
                margin: 10px;
            }

            .title {
                font-size: 24px;
            }

            .subtitle {
                font-size: 16px;
            }

            .modules-preview {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .module-card {
                padding: 15px;
            }

            .auth-section {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .main-container {
                padding: 20px;
            }

            .ai-icon {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }

            .title {
                font-size: 20px;
            }

            .subtitle {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- 背景动画 -->
    <div class="bg-animation"></div>

    <div class="main-container">
        <!-- Logo 和标题区域 -->
        <div class="logo-section">
            <div class="ai-icon">🧠</div>
            <h1 class="title">AI复读提分预测系统</h1>
            <p class="subtitle">基于人工智能大模型，精准分析四大核心维度，科学预测复读提升空间</p>
        </div>

        <!-- 四大模块预览 -->
        <div class="modules-preview">
            <div class="module-card">
                <div class="module-icon">📚</div>
                <div class="module-title">学习潜力</div>
                <div class="module-desc">评估认知能力与学习效率</div>
            </div>
            <div class="module-card">
                <div class="module-icon">💪</div>
                <div class="module-title">心理抗压</div>
                <div class="module-desc">分析应试心理承受能力</div>
            </div>
            <div class="module-card">
                <div class="module-icon">🎯</div>
                <div class="module-title">规划能力</div>
                <div class="module-desc">考察时间管理与执行力</div>
            </div>
            <div class="module-card">
                <div class="module-icon">🔥</div>
                <div class="module-title">目标动机</div>
                <div class="module-desc">测量内在驱动与坚持度</div>
            </div>
        </div>

        <!-- 认证区域 -->
        <div class="auth-section">
            <h2 class="auth-title">开始专业测评</h2>
            <form id="passwordForm">
                <div class="input-group">
                    <input type="password" id="password" name="password" class="password-input" placeholder=" " required>
                    <label class="input-label" for="password">🔐 请输入访问密码</label>
                </div>
                
                <button type="submit" class="submit-btn">
                    进入AI测评系统
                </button>
                
                <div id="errorMessage" class="error-message">
                    ❌ 访问密码错误，请重新输入
                </div>
            </form>
        </div>

        <div class="features-text">
            本系统采用<span class="highlight">多维度智能分析</span>，结合<span class="highlight">大数据建模</span>，
            为您提供<span class="highlight">个性化</span>的复读提分建议和精准预测
        </div>
    </div>

    <script>
        // 生成背景动画元素
        function createFloatingElements() {
            const bgAnimation = document.querySelector('.bg-animation');
            for (let i = 0; i < 15; i++) {
                const element = document.createElement('div');
                element.className = 'floating-element';
                element.style.left = Math.random() * 100 + '%';
                element.style.animationDelay = Math.random() * 20 + 's';
                element.style.animationDuration = (Math.random() * 10 + 15) + 's';
                bgAnimation.appendChild(element);
            }
        }

        // 密码验证逻辑（保持不变）
        document.getElementById('passwordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            
            if (password === '7834520') {
                // 密码正确，跳转到测试页面
                window.location.href = 'test.html';
            } else {
                // 密码错误，显示错误信息
                errorMessage.style.display = 'block';
                document.getElementById('password').style.borderColor = '#e53e3e';
                document.getElementById('password').style.boxShadow = '0 0 0 4px rgba(229, 62, 62, 0.1)';
                
                // 2秒后隐藏错误信息
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                    document.getElementById('password').style.borderColor = '#e2e8f0';
                    document.getElementById('password').style.boxShadow = 'none';
                }, 3000);
            }
        });

        // 初始化动画
        createFloatingElements();

        // 输入框焦点效果
        const passwordInput = document.getElementById('password');
        passwordInput.addEventListener('focus', function() {
            this.parentElement.style.transform = 'scale(1.02)';
        });

        passwordInput.addEventListener('blur', function() {
            this.parentElement.style.transform = 'scale(1)';
        });
    </script>
</body>
</html>
